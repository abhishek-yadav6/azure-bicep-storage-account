#cloud-config
package_update: true
packages:
  - mysql-server
runcmd:
  - sed -i 's/^bind-address.*/bind-address = 0.0.0.0/' /etc/mysql/mysql.conf.d/mysqld.cnf
  - systemctl enable mysql
  - systemctl restart mysql
  - mysql -e "CREATE DATABASE IF NOT EXISTS __DB_NAME__;"
  - mysql -e "CREATE USER IF NOT EXISTS '__DB_USER__'@'%' IDENTIFIED BY '__DB_PASSWORD__';"
  - mysql -e "GRANT ALL PRIVILEGES ON __DB_NAME__.* TO '__DB_USER__'@'%';"
  - mysql -e "FLUSH PRIVILEGES;"
