name: Validate Bicep

on:
  pull_request:
    branches: [main]
    paths:
      - '**.bicep'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install/upgrade Bicep
        run: az bicep install

      - name: Build main.bicep
        run: az bicep build --file main.bicep

      - name: Build each module
        run: |
          set -e
          for f in modules/*.bicep; do
            echo "Building $f"
            az bicep build --file "$f"
          done
